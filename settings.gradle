dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "Hexora"
include ':app'
include ':sdk'
include ':packs:pack-math'
include ':packs:pack-notes'
include ':packs:pack-text'
include ':packs:pack-random'
include ':packs:pack-device'
include ':packs:pack-media'
include ':packs:pack-network'
include ':samples:plugin-sample'
include ':samples:plugin-kill-sig'
// Opt in after a debug build creates the local Android debug signing key.
if (providers.gradleProperty('signatureFixtures').getOrElse('false').toBoolean()) {
    include ':samples:signature-fixture'
}
include ':apkkit'
if (providers.gradleProperty('shareFixtures').getOrElse('false').toBoolean()) {
    include ':samples:share-fixture'
}
